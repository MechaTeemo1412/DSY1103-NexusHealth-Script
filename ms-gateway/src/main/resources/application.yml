server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:  # <-- La jerarquía correcta es esta
      routes:
        - id: ms-pacientes
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/pacientes/**

        - id: ms-agenda
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/agenda/**

        - id: ms-examenes
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/examenes/**

        - id: ms-notificaciones
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/notificaciones/**

        - id: ms-auditoria
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/auditoria/**

        - id: ms-orquestador
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/alertas/**